server:
  port: 9007

spring:
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/dataspace_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useSSL=true
          username: ${DB_USERNAME}
          password: ${DB_PASSWORD}
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: true
    encoding: UTF-8
    mode: HTML
    servlet:
      content-type: text/html
    check-template-location: true
  redis:
    database: 0
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 1000s
    lettuce:
      pool:
        max-active: 100
        max-wait: -1
        max-idle: 10
        min-idle: 2
  pagehelper:
    helperDialect: mysql
    reasonable: true
    supportMethodsArguments: true
    params: count=countSql
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 0
      max-file-size: 5MB
      max-request-size: 5MB
  aop:
    auto: true

mybatis-plus:
  type-aliases-package: sz.lab.entity
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      update-strategy: not_null
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml

logging:
  level:
    sz.lab.mapper: info
  config: classpath:logback-spring.xml
  file:
    path: ./logs

custom-attribute:
  dept-id: 1
  verification-code-expire: 30
  jwt:
    token-expire: 240
    secret: ${JWT_SECRET:ADB8E3D5838A0AE8E274014928CE2CEE}
  lock-time: 30
  pwd-reset-time: 90

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT}
    accessKeyId: ${OSS_ACCESS_KEY_ID}
    accessKeySecret: ${OSS_ACCESS_KEY_SECRET}
    bucketName: ${OSS_BUCKET_NAME:trustdataspace}

edc:
  version: ${EDC_VERSION:v0.10.1}
  jar:
    base-url: ${EDC_JAR_BASE_URL:https://dataspace2026.oss-cn-hangzhou.aliyuncs.com/edc-jars}

huayichain:
