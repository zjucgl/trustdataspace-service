server:
  port: 9007

spring:
  datasource:
    dynamic:
      primary: master #设置默认的数据源或者数据源组,默认值即为 master
      strict: false # 设置严格模式，当数据源找不到时，是否抛出异常，默认为false不抛出
      datasource:
        master: # 主库
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://211.91.61.25:23306/mvd_end_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useSSL=false
          username: root
          password: lab309@nbt
#        slave: # 从库
#          driver-class-name: org.postgresql.Driver
#          url: jdbc:postgresql://211.91.61.25:25432/provider_qna?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&ssl=false
#          username: postgres
#          password: postgres

#    url: jdbc:mysql://localhost:3306/soldier_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useSSL=false
#    username: root
#    password: mysql
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8
    mode: HTML
    servlet:
      content-type: text/html
    check-template-location: true
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    timeout: 1000s
    lettuce:
      pool:
        max-active: 100
        max-wait: -1
        max-idle: 10
        min-idle: 2
  pagehelper:
    helperDialect: mysql
    reasonable: true
    supportMethodsArguments: true
    params: count=countSql
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 0
      max-file-size: 5MB # 附件最大上传5M
      max-request-size: 5MB # 附件最大上传5M
  aop:
    auto: true        #开启aop注解，默认为false

mybatis-plus:
  type-aliases-package: sz.lab.entity
  global-config:
    db-config:
      logic-delete-field: is_deleted  # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
      update-strategy: not_null
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml

logging:
  level:
    sz.lab.mapper: info
  config: classpath:logback-spring.xml
  file:
    path: ./logs

custom-attribute: # 自定义属性
  dept-id: 1 # 部门(实验室)ID
  verification-code-expire: 30 # 验证码超期时间，30秒
  jwt:
    token-expire: 240 # token有效时长，60 * 4小时，单位分钟
  lock-time: 30 #账号锁定时间
  pwd-reset-time: 90 #密码过期时间，单位天
minio:
  endpoint: http://211.91.61.25:29000 #Minio服务所在地址
  accessKey: minioadmin #访问的key
  secretKey: minioadmin #访问的秘钥
keystore:
  dir: /data/li/data/keystore
gethAddress: http://192.168.14.3:8545


